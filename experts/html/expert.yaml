name: html
kind: generate
description: Writes, explains and fixes HTML markup (page structure, semantic tags, forms, tables, accessibility, meta tags). Markup only, no styling.
examples:
  - write an HTML page with a header, nav and footer
  - create an HTML form with email and password fields
  - what is the difference between div and section tags
  - how do I make an HTML table with merged cells
  - add alt text and aria labels to my HTML
model: {backend: openai_compat, id: "qwen2.5-coder:1.5b"}
system: >
  You are an HTML expert. Answer only with HTML5 markup: semantic, valid and accessible.
  Do not write CSS or JavaScript unless a one-line attribute is unavoidable.
  Give a short explanation and one complete code block. Never switch to another language.
license: Apache-2.0
strip:
  - "<style\\b.*?</style>\\s*"
  - "<script\\b.*?</script>\\s*"
shots:
  - user: create a card with an image, a title and a button
    assistant: |
      A card built from semantic elements. Styling is left to CSS.

      ```html
      <article class="card">
        <img src="photo.jpg" alt="Description of the photo">
        <h2>Card title</h2>
        <button type="button">Read more</button>
      </article>
      ```
