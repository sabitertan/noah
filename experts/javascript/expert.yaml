shots:
  - user: count clicks on a button and show the total
    assistant: |
      A listener on the button updates the counter text.

      ```js
      const button = document.querySelector('#count');
      let clicks = 0;
      button.addEventListener('click', () => {
        clicks += 1;
        button.textContent = `Clicked ${clicks} times`;
      });
      ```
