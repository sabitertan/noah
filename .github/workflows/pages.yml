name: Browser build (GitHub Pages)

# Publishes the browser-only build of Noah (Python runs in the page with Pyodide; models in the visitor's own Ollama) as a
# static site. Enable it once: Settings > Pages > Source: "GitHub Actions". Then run it from the Actions tab or push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build the static site
        working-directory: frontend
        run: |
          npm ci
          npm run build:wasm
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
