name: Desktop builds

# Builds the Noah desktop app on real Windows, macOS and Linux runners (PyInstaller and Electron do not cross-compile).
# Run it from the Actions tab ("Run workflow") or push a tag like v0.1.0. Installers appear under "Artifacts".
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, artifact: noah-windows, glob: "desktop/dist/*.exe" }
          - { os: ubuntu-latest,  artifact: noah-linux,   glob: "desktop/dist/*.AppImage" }
          - { os: macos-latest,   artifact: noah-macos,   glob: "desktop/dist/*.dmg" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: desktop/package-lock.json }

      - name: Python deps + tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[container]" pyinstaller
          python -m pytest -q

      - name: Freeze the Noah server (PyInstaller)
        run: python desktop/build_sidecar.py

      - name: Build the Electron app
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned builds: expect SmartScreen / Gatekeeper warnings

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
