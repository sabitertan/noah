[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noah"
version = "0.1.0"
description = "Layered tiny-model orchestration: pick an orchestrator and a decision engine, hand each job to a small expert."
requires-python = ">=3.10"
dependencies = [
  "agent-framework-core>=1.21",
  "agent-framework-orchestrations>=1.3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pyyaml>=6",
  "fastembed>=0.7",
  "numpy>=1.26",
  "pypdf>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.45"]
laya = ["laya>=0.4"]  # Laya decision engine (pulls torch + transformers; not in the image or desktop build)
container = ["pytest>=8", "watchfiles>=0.21"]  # what the dev image adds: tests + live reload

[project.scripts]
noah = "noah.cli:main"

[tool.setuptools.packages.find]
include = ["noah*"]

[tool.setuptools.package-data]
noah = ["web/*.html", "web/static/*", "web/static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
