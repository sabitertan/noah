# Docker:  docker compose up --build
# Podman:  podman compose up --build      (or: podman-compose up --build)
# Then open http://localhost:8765
# Podman-only hint (Docker ignores x- keys): no shared pod, so each container gets the keep-id user mapping.
x-podman:
  in_pod: false

services:
  ollama:
    image: docker.io/ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    # Not published on purpose: a host Ollama on :11434 keeps working. Uncomment to reach it from the host.
    # ports: ["11434:11434"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot job: pulls the tiny models the default experts use, then exits.
  models:
    image: docker.io/ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["for m in $${NOAH_MODELS:-qwen2.5:0.5b qwen2.5-coder:1.5b}; do ollama pull $$m; done"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      NOAH_MODELS: ${NOAH_MODELS:-qwen2.5:0.5b qwen2.5-coder:1.5b}
    restart: "no"

  noah:
    build: .
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "8765:8765"
    environment:
      NOAH_LLM_URL: http://ollama:11434
      HF_TOKEN: ${HF_TOKEN:-}      # optional: use Hugging Face hosted models without typing the token in the UI
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}   # optional: same for OpenRouter
      AZURE_FOUNDRY_ENDPOINT: ${AZURE_FOUNDRY_ENDPOINT:-}   # optional: Azure Foundry (https://<resource>.openai.azure.com) ...
      AZURE_FOUNDRY_API_KEY: ${AZURE_FOUNDRY_API_KEY:-}     # ... and its key
      # image expert: sd-server on the host (scripts/image_server.sh with NOAH_IMAGE_HOST=0.0.0.0; a container cannot reach host loopback)
      NOAH_IMAGE_URL: ${NOAH_IMAGE_URL:-http://host.docker.internal:1234}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Docker on Linux needs this; Docker Desktop and Podman define the name themselves
    # Persisted state. For live-editing code, use the dev override:  make dev
    volumes:
      - ./data:/app/data:z
      - ./traces:/app/traces:z

volumes:
  ollama:
