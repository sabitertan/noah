<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noah</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<nav class="sidebar" id="sidebar" aria-label="Sidebar">
  <div class="sb-head">
    <button class="icon-btn" id="hamb" title="Toggle sidebar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <span class="brand">Noah</span>
  </div>
  <div class="sb-inner" id="sbInner"></div>
</nav>
<main>
  <div class="topbar"><button class="icon-btn hamb" id="hamb2" title="Open sidebar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button><span id="title">New Chat</span></div>

  <section class="view active" id="v-chat">
    <div id="log"><div class="wrap" id="thread"></div></div>
    <form class="composer" id="form">
      <textarea id="msg" rows="1" placeholder="Message Noah…" autocomplete="off"></textarea>
      <div class="crow">
        <span class="pill" title="Orchestrator profile"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg><select id="profileSel"></select></span>
        <span class="sp"></span>
        <span class="toggle" id="modeToggle"><button type="button" data-m="route" class="on">Route</button><button type="button" data-m="fanout">Fan-out</button></span>
        <button class="send" id="send" title="Send"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
      </div>
    </form>
  </section>

  <section class="view" id="v-orch"><div class="panel" id="orchPanel"></div></section>
  <section class="view" id="v-experts"><div class="panel" id="expertsPanel"></div></section>
  <section class="view" id="v-models"><div class="panel" id="modelsPanel"></div></section>
  <section class="view" id="v-traces"><div class="panel" id="tracesPanel"></div></section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
